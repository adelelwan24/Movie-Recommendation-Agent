[project]
name = "movieagent"
version = "0.1.0"
description = "Agentic movie discovery and analysis over the TMDB 5000 dataset"
requires-python = ">=3.12,<3.13"

# Pinned with lower+upper bounds deliberately: ADR-0020 accepted a fast-moving
# LangChain/LangGraph tree as the cost of adopting the framework, and pinning is
# the only mitigation. `requirements.txt` holds the fully resolved lock.
dependencies = [
    # data layer (ADR-0005)
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=15.0",
    # config (ADR-0015)
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # agent runtime (ADR-0020, ADR-0021)
    "langgraph>=0.2.28,<0.7",
    "langchain-core>=0.3.0,<0.4",
    "langchain-openai>=0.2.0,<0.4",
    # retrieval (ADR-0007, ADR-0009)
    "rapidfuzz>=3.9,<4.0",
    "sentence-transformers>=3.0,<6.0",
    # vector store (ADR-0006). Embedded by default -- no server required; the same
    # client talks to a cluster when QDRANT_URL is set.
    "qdrant-client>=1.9,<2.0",
    # UI (ADR-0014)
    "streamlit>=1.36,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movieagent"]

[tool.pytest.ini_options]
# ADR-0019: src layout without requiring an editable install for the test run.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits a real LLM provider; excluded by default (ADR-0024 tier 4)",
    "model_coupled: assertions depend on the pinned embedding model (ADR-0024 tier 3)",
]
addopts = "-m 'not live'"
